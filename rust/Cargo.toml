# Crew rebuilt in Rust and GPUI. Electron Crew stays in the repository root until this reaches parity.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.6.24"
edition = "2024"
publish = false

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit"] }
gpui-component = { version = "=0.9.0", features = ["syntect"] }
gpui-kit-assets = "=0.9.0"
alacritty_terminal = "0.26"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
