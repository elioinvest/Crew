<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A62"/>
      <stop offset="0.55" stop-color="#E8623F"/>
      <stop offset="1" stop-color="#C2412F"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7A1E10" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#shine)"/>
  <!-- two chevrons in tandem + cursor -->
  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="92">
    <path d="M250 330 L430 512 L250 694" stroke="#FFFFFF" stroke-opacity="0.55"/>
    <path d="M440 330 L620 512 L440 694" stroke="#FFFFFF"/>
    <path d="M650 694 L790 694" stroke="#FFFFFF"/>
  </g>
</svg>
