<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob: file: https: http:" />
  <title>Crew</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-top drag">
        <div class="brand"><img src="../build/icon.svg" alt="" />Crew</div>
        <div class="side-top-actions no-drag">
          <button class="icon-btn" id="btn-search" title="Search (Ctrl+K)">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
          <button class="icon-btn" id="btn-settings" title="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
        </div>
      </div>

      <div class="search-wrap hidden" id="search-wrap">
        <input id="search" type="text" placeholder="Search projects and sessions" spellcheck="false" />
      </div>

      <button class="nav-item" id="btn-new">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span>New session</span>
      </button>

      <div class="section-head">
        <span>Projects</span>
        <button class="icon-btn small" id="btn-add-project" title="Add project folder">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <div id="project-list"></div>
    </aside>

    <div id="resizer"></div>

    <main id="main">
      <header id="main-head" class="drag">
        <button class="icon-btn no-drag" id="btn-sidebar" title="Hide sidebar">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <div class="head-info">
          <div id="head-title"></div>
          <div id="head-path"></div>
        </div>
        <div class="head-actions no-drag">
          <button class="icon-btn" id="btn-restart" title="Restart session">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button class="icon-btn" id="btn-close" title="Close session (stops the process)">
            <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="head-layout no-drag">
          <button class="icon-btn" id="btn-split-right" title="Split right (Ctrl+\)">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
          </button>
          <button class="icon-btn" id="btn-split-down" title="Split down (Ctrl+Shift+\)">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18"/></svg>
          </button>
        </div>
        <button class="icon-btn no-drag" id="btn-browser" title="Toggle browser">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg>
        </button>
      </header>

      <div id="terminals"></div>

      <div id="composer" class="hidden">
        <div class="composer-card">
          <div id="composer-attachments" class="hidden"></div>
          <textarea id="composer-input" rows="1" spellcheck="false" placeholder="How can I help you today?"></textarea>
          <div class="composer-row">
            <button class="icon-btn" id="composer-attach" title="Attach files">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <span id="composer-hint"></span>
            <button id="composer-send" title="Send (Enter)" disabled>
              <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-meta">
          <button class="chip" id="chip-project"></button>
          <span class="spacer"></span>
          <button class="chip strong" id="chip-model" title="Model"></button>
          <button class="chip" id="chip-effort" title="Effort"></button>
          <button class="chip strong" id="chip-mode" title="Permission mode"></button>
        </div>
      </div>

      <div id="empty">
        <div class="agent-toggle" id="agent-toggle">
          <button data-agent="claude">Claude</button>
          <button data-agent="codex">Codex</button>
        </div>
        <h1>Where should we start?</h1>
        <div class="empty-picker">
          <select id="empty-project"></select>
          <button id="empty-start" class="primary">Start Claude</button>
        </div>
        <p class="hint">Pick a session on the left to resume it, or start a new one in a project.</p>
      </div>
    </main>

    <div id="browser-resizer" class="hidden"></div>

    <section id="browser" class="hidden">
      <div class="browser-tabs drag">
        <div id="br-tabs" class="no-drag"></div>
        <button class="icon-btn no-drag" id="br-new-tab" title="New tab (Ctrl+T)">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <span class="tabs-spacer"></span>
        <button class="icon-btn no-drag" id="br-close" title="Close browser">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="browser-bar">
        <div class="browser-nav no-drag">
          <button class="icon-btn" id="br-back" title="Back">
            <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button class="icon-btn" id="br-forward" title="Forward">
            <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <button class="icon-btn" id="br-reload" title="Reload">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
        </div>
        <form id="br-form" class="no-drag">
          <input id="br-url" type="text" spellcheck="false" placeholder="Enter a URL or search" />
        </form>
        <div class="browser-nav no-drag">
          <button class="icon-btn" id="br-external" title="Open in default browser">
            <svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          </button>
        </div>
      </div>
      <div id="browser-body"></div>
    </section>
  </div>

  <div id="menu" class="menu hidden"></div>

  <div id="viewer" class="hidden">
    <div class="viewer-bar">
      <span id="viewer-name"></span>
      <button id="viewer-open">Open</button>
      <button id="viewer-show">Show in folder</button>
      <button id="viewer-copy">Copy path</button>
      <button class="icon-btn" id="viewer-close" title="Close (Esc)">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="viewer-stage">
      <img id="viewer-img" alt="" />
      <div id="viewer-error" class="hidden">Couldn't load this image. It may have been moved or deleted.</div>
    </div>
  </div>

  <div id="settings" class="modal hidden">
    <div class="modal-card">
      <h2>Settings</h2>
      <div class="row">
        <label>Claude command
          <input id="cfg-command" type="text" spellcheck="false" />
        </label>
        <label>Claude arguments
          <input id="cfg-args" type="text" spellcheck="false" placeholder="e.g. --model opus" />
        </label>
      </div>
      <div class="row">
        <label>Codex command
          <input id="cfg-codex-command" type="text" spellcheck="false" />
        </label>
        <label>Codex arguments
          <input id="cfg-codex-args" type="text" spellcheck="false" placeholder="e.g. -m gpt-5.5" />
        </label>
      </div>
      <div class="row">
        <label>Theme
          <select id="cfg-theme"><option value="light">Light</option><option value="dark">Dark</option></select>
        </label>
        <label>Font size
          <input id="cfg-font" type="number" min="9" max="28" />
        </label>
      </div>
      <label class="check"><input id="cfg-tray" type="checkbox" /> Keep running in the tray when the window is closed</label>
      <p class="hint">Command and arguments apply to sessions started after saving.</p>
      <div class="modal-actions">
        <button id="cfg-cancel">Cancel</button>
        <button id="cfg-save" class="primary">Save</button>
      </div>
    </div>
  </div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
